name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            shared/package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: 安装依赖（含根目录 playwright 等）
        run: npm install && npm run install:all

      - name: 构建（shared → server → client）
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: 测试（server vitest）
        run: npm run test

      - name: E2E 冒烟（Playwright）
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
